[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kline-camp"
version = "0.1.0"
description = "K线训练营：用你自己的本地日线做逐根回放训练（盲盒出题 / T+1 成交 / 三方对照）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "大肥鱼" }]
keywords = ["kline", "a-share", "trading", "training", "backtesting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pandas>=2.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
kline-camp = "klinecamp.cli:main"

[project.urls]
Homepage = "https://github.com/yoxd210/kline-camp"

[tool.setuptools]
packages = ["klinecamp"]

[tool.setuptools.package-data]
klinecamp = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
